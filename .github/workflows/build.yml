name: native-build

on:
  push:
    branches: [ "*" ]
    tags: [ "*" ]
  pull_request:
    branches: [ custom ]
  workflow_dispatch:

jobs:
  source:
    if: ${{ !github.head_ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Pack
        run: ./.ci/source.sh
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: source
          path: artifacts/
          compression-level: 9
  android:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: android
      TARGET: universal
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-
      - name: Update deb repositories
        run: sudo apt-get update
      - name: Install New Packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: zip unzip python3 ccache apksigner 
      - name: Install JDK 17 
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          check-latest: true
      - name: Install Android NDK r29
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          link-to-sdk: true
      - name: Build
        run: |
          ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }} JAVA_HOME=$JAVA_HOME_17_X64 ./gradlew assembleExtendedGithubRelease
          mkdir -p app/build/outputs/apk/release
          cp app/build/outputs/apk/extendedGithub/release/*-unsigned.apk app/build/outputs/apk/release/
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Sign app APK
        uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release 
          signingKeyBase64: ${{ secrets.DROID_KEYSTORE_B64 }}
          alias: ${{ secrets.DROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.DROID_KEYSTORE_PASS }}
          keyPassword: ${{ secrets.DROID_KEY_PASS }}
          zipAlign: true
        env:
          BUILD_TOOLS_VERSION: "36.0.0"
      - name: Clean up artifacts
        run: |
          rm app/build/outputs/apk/release/*-unsigned.apk* 
          rm app/build/outputs/apk/release/*-signed.apk.* 
          rm app/build/outputs/apk/release/signingKey.jks 
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OS }}-${{ env.TARGET }}
          path: app/build/outputs/apk/release 
          compression-level: 9
  release:
    runs-on: ubuntu-latest
    needs: [android]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/download-artifact@v7
      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
      - name: Upload artifacts
        uses: alexellis/upload-assets@0.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          asset_paths: '["./**/*.apk","./**/*.aab"]'

